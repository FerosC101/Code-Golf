# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# The frontend is deployed separately on Vercel (see README).
#
# All three resources must share a region. Change `region` everywhere if
# oregon is far from your players (e.g. singapore, frankfurt).

databases:
  - name: codegolf-db
    databaseName: codegolf
    user: codegolf
    plan: basic-256mb   # free also works, but free databases expire after 30 days
    region: oregon

services:
  # Game server: REST + WebSockets + round timers. Must stay a single instance.
  - type: web
    name: codegolf-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: starter        # not free: free services sleep and would drop live games
    region: oregon
    numInstances: 1
    healthCheckPath: /api/health
    buildFilter:
      paths: ["backend/**"]
    envVars:
      - key: CG_DATABASE_URL
        fromDatabase:
          name: codegolf-db
          property: connectionString
      - key: CG_EXECUTOR_URL
        fromService:
          type: pserv
          name: codegolf-executor
          property: hostport
      - key: CG_EXECUTOR_TOKEN
        fromService:
          type: pserv
          name: codegolf-executor
          envVarKey: EXEC_TOKEN
      # Your Vercel URL, e.g. https://code-golf.vercel.app (comma-separate several).
      - key: CG_CORS_ORIGINS
        sync: false
      # Optional, allows Vercel preview deploys: https://code-golf(-[a-z0-9-]+)?\.vercel\.app
      - key: CG_CORS_ORIGIN_REGEX
        sync: false

  # Code runner. Private service: no public URL, no database credentials.
  # Render has no Docker daemon, so this uses process mode (see README).
  - type: pserv
    name: codegolf-executor
    runtime: docker
    dockerContext: ./executor
    dockerfilePath: ./executor/Dockerfile
    plan: starter
    region: oregon
    buildFilter:
      paths: ["executor/**"]
    envVars:
      - key: EXEC_MODE
        value: process
      - key: EXEC_TOKEN
        generateValue: true
      - key: EXEC_MAX_CONCURRENCY
        value: "2"
